<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .navbar-brand { font-weight: 700; letter-spacing: 0.5px; }
        .card { border-radius: 10px; border: none; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .table th { background-color: #343a40; color: white; font-weight: 600; }
        .badge-dept { background-color: #e0e7ff; color: #4338ca; font-weight: 600; }
    </style>
</head>
<body>

    <nav className="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div className="container">
            <a className="navbar-brand" href="#"><i className="bi bi-people-fill me-2"></i>EMS Portal</a>
        </div>
    </nav>

    <div className="container">
        <div className="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 className="fw-bold text-dark mb-1">Employee Directory</h2>
                <p className="text-muted small">Manage and view all employee records</p>
            </div>
        </div>

        <div className="card shadow-sm">
            <div className="card-body p-0">
                <div className="table-responsive">
                    <table className="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Emp ID</th>
                                <th>Name</th>
                                <th>Email</th>
                                <th>Mobile</th>
                                <th>Department</th>
                                <th>Designation</th>
                                <th>Salary</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${#lists.isEmpty(employees)}">
                                <td colspan="7" className="text-center py-4 text-muted">
                                    <i className="bi bi-inbox fs-3 d-block mb-2"></i>
                                    No employee records found.
                                </td>
                            </tr>
                            <tr th:each="emp : ${employees}">
                                <td className="fw-bold text-primary" th:text="${emp.employeeId}">EMP-001</td>
                                <td className="fw-semibold" th:text="${emp.firstName + ' ' + emp.lastName}">John Doe</td>
                                <td th:text="${emp.email}">john@example.com</td>
                                <td th:text="${emp.mobile}">9876543210</td>
                                <td>
                                    <span className="badge badge-dept px-2 py-1" th:text="${emp.departmentName != null ? emp.departmentName : 'Unassigned'}">Engineering</span>
                                </td>
                                <td th:text="${emp.designation}">Software Engineer</td>
                                <td className="fw-bold text-success" th:text="${'$' + #numbers.formatDecimal(emp.salary, 1, 'COMMA', 2, 'POINT')}">$85,000.00</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
